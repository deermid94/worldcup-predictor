<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04130c; --emerald:#2fd47a; --teal:#1fc7c0;
    --gold:#ffd24a; --text:#eafff2; --muted:#7fa593; --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, #0b2c1d, var(--bg) 60%);
    color:var(--text); min-height:100vh; display:grid; place-items:center;
    padding:32px 18px; -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* animated background — carried over from the predictor */
  .pitchbg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
  .pitchbg .blob{position:absolute;border-radius:50%;filter:blur(72px);
    opacity:.55;mix-blend-mode:screen;will-change:transform}
  .pitchbg .b1{width:58vmax;height:58vmax;left:-16vmax;top:-22vmax;
    background:radial-gradient(circle,#1aa75a,transparent 62%);animation:drift1 30s ease-in-out infinite}
  .pitchbg .b2{width:52vmax;height:52vmax;right:-18vmax;top:2vmax;
    background:radial-gradient(circle,#d9a521,transparent 62%);animation:drift2 36s ease-in-out infinite}
  .pitchbg .b3{width:46vmax;height:46vmax;left:18vmax;bottom:-24vmax;
    background:radial-gradient(circle,#10b6ac,transparent 62%);animation:drift3 42s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(8vmax,6vmax) scale(1.1)}}
  @keyframes drift2{50%{transform:translate(-7vmax,5vmax) scale(1.08)}}
  @keyframes drift3{50%{transform:translate(5vmax,-7vmax) scale(1.12)}}
  @keyframes shimmer{to{background-position:220% center}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){.blob,.trophy,.card{animation:none!important}}

  .card{
    text-align:center; max-width:640px; position:relative; z-index:1;
    animation:rise .8s ease both;
  }
  .trophy{font-size:clamp(4rem,16vw,7.5rem); line-height:1; display:block;
    filter:drop-shadow(0 8px 30px rgba(255,210,74,.35)); animation:float 5s ease-in-out infinite}
  .kicker{display:inline-block;margin-top:14px;font-size:.7rem;font-weight:700;
    letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
    padding:7px 16px;border:1px solid var(--line);border-radius:999px}
  h1{margin:22px 0 0;font-weight:900;line-height:1.04;
    font-size:clamp(2.1rem,8.5vw,4.2rem);letter-spacing:-.02em}
  .name{
    background:linear-gradient(100deg,var(--gold),#fff6d0,var(--gold),var(--emerald),var(--gold));
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shimmer 4.5s linear infinite;
  }
  .sub{margin-top:20px;color:var(--muted);font-size:clamp(.95rem,3.6vw,1.15rem);font-weight:500}
  .sub b{color:var(--text);font-weight:700}
  .foot{margin-top:34px;font-size:.72rem;color:var(--muted);letter-spacing:.05em}
</style>
</head>
<body>
  <div class="pitchbg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <main class="card">
    <span class="trophy">🏆</span>
    <span class="kicker">FIFA World Cup 2026 · Full time</span>
    <h1>Well done<br><span class="name">Spain</span> &amp; <span class="name">Cactus</span></h1>
    <p class="sub">World champions <b>Spain</b> 🇪🇸 &nbsp;·&nbsp; predictor champion <b>Cactus</b> 🌵</p>
    <p class="foot">Thanks for playing, lads. See you in 2030. ⚽</p>
  </main>
</body>
</html>
